[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-workspace"
version = "3.0.0"
description = "Local project memory, cited answers, and a persistent task board"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
agent-workspace = "agent_workspace.cli:main"

[tool.setuptools]
packages = ["agent_workspace"]
include-package-data = true

[tool.setuptools.package-data]
agent_workspace = ["static/*", "sample/*"]
